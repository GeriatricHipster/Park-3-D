<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182433">
  <title>John R. Park Building | Interactive 3D</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dce4ea;color:#172638}
    header{position:absolute;z-index:2;top:env(safe-area-inset-top,12px);left:12px;right:12px;max-width:430px;background:#182433ee;color:#fff;padding:15px 18px;border-radius:12px;box-shadow:0 4px 24px #0002;pointer-events:none}
    h1{font-size:1.1rem;margin:0 0 5px}header p{font-size:.8rem;line-height:1.4;margin:0;color:#d5dce4}
    model-viewer{display:block;width:100%;height:100%;background:linear-gradient(#b9c9d7,#edf1f4);--progress-bar-color:#cda65a}
    .bottom{position:absolute;z-index:2;bottom:calc(16px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    button{border:0;border-radius:8px;padding:12px 16px;background:#182433;color:white;font-size:14px;font-weight:600;cursor:pointer}
    #status{position:absolute;z-index:3;left:12px;right:12px;top:50%;transform:translateY(-50%);margin:auto;max-width:420px;padding:14px;border-radius:10px;background:#fffef5;color:#172638;text-align:center;box-shadow:0 5px 24px #0002}
    #status[hidden]{display:none}
    @media(max-width:600px){header{max-width:none}header p{font-size:.73rem}}
  </style>
</head>
<body>
  <header><h1>John R. Park Building</h1><p>Interactive 3D building model · Drag to rotate · Pinch or scroll to zoom</p></header>
  <model-viewer id="building" src="./John_R_Park_Building.glb" alt="Interactive 3D rendering of the John R. Park Building" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1" interaction-prompt="auto" loading="eager" reveal="auto"></model-viewer>
  <div id="status" role="status">Loading 3D building…</div>
  <div class="bottom"><button id="reset" type="button">Reset view</button><button id="spin" type="button" aria-pressed="false">Auto-rotate</button><button id="fullscreen" type="button">Full screen</button></div>
  <script>
    const viewer=document.getElementById('building');
    const status=document.getElementById('status');
    viewer.addEventListener('load',()=>{status.hidden=true;});
    viewer.addEventListener('error',e=>{status.hidden=false;status.textContent='Could not load the 3D model. Check that John_R_Park_Building.glb is uploaded beside index.html and that the filename matches exactly.';console.error(e);});
    setTimeout(()=>{if(!viewer.modelIsVisible){status.hidden=false;status.textContent='Still loading. If this persists, check your internet connection and confirm the GLB filename matches exactly.';}},20000);
    document.getElementById('reset').addEventListener('click',()=>{viewer.cameraOrbit='auto auto auto';viewer.cameraTarget='auto auto auto';viewer.fieldOfView='auto';viewer.jumpCameraToGoal();});
    document.getElementById('spin').addEventListener('click',e=>{viewer.autoRotate=!viewer.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(viewer.autoRotate));e.currentTarget.textContent=viewer.autoRotate?'Stop rotation':'Auto-rotate';});
    document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(viewer.requestFullscreen)await viewer.requestFullscreen();else status.textContent='Full screen is not supported by this browser.';}catch(e){console.warn(e);}});
  </script>
</body>
</html>
